[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raylcat"
version = "0.1.0"
description = "Tool to convert scratch3 .sb3 files into compilable go  + raylib code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12" #TODO: check the actual needed minimum python version
dependencies = [
    "base26",
    "cairosvg",
]

[project.scripts]
raylcat = "raylcat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raylcat"]

[tool.hatch.build]
include = [
    "src/raylcat/**/block_specs.json",
    "src/raylcat/go_templates",
]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
